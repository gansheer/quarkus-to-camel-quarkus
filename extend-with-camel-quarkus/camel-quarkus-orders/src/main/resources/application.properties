# Quarkus
quarkus.http.port=8080

# Kafka (Dev Services starts a broker automatically with Podman/Docker)
camel.component.kafka.brokers=${kafka.bootstrap.servers:localhost:9092}

# Loyalty API (mock endpoint running inside this app)
loyalty.api.url=localhost:${quarkus.http.port}

# Logging
quarkus.log.category."org.apache.camel".level=INFO
quarkus.log.category."org.apache.kafka".level=WARN
